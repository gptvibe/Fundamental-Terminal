services:
  backend:
    environment:
      APP_PROFILE: ${APP_PROFILE:-lite}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      OBSERVABILITY_MAX_RECORDS: ${OBSERVABILITY_MAX_RECORDS:-500}
      PERFORMANCE_AUDIT_ENABLED: ${PERFORMANCE_AUDIT_ENABLED:-false}
      HOT_RESPONSE_CACHE_ENABLED: ${HOT_RESPONSE_CACHE_ENABLED:-true}
      STRICT_OFFICIAL_MODE: ${STRICT_OFFICIAL_MODE:-true}

  data-fetcher:
    environment:
      APP_PROFILE: ${APP_PROFILE:-lite}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REFRESH_QUEUE_POLL_SECONDS: ${REFRESH_QUEUE_POLL_SECONDS:-10}
      DATA_FETCHER_STARTUP_DELAY_SECONDS: ${DATA_FETCHER_STARTUP_DELAY_SECONDS:-180}
      DATA_FETCHER_ENQUEUE_ON_STARTUP: ${DATA_FETCHER_ENQUEUE_ON_STARTUP:-false}
      DATA_FETCHER_RUN_MACRO_WORKER: ${DATA_FETCHER_RUN_MACRO_WORKER:-false}
      WORKER_IDENTIFIERS: ${WORKER_IDENTIFIERS:-AAPL,MSFT}
      OBSERVABILITY_MAX_RECORDS: ${OBSERVABILITY_MAX_RECORDS:-500}
      PERFORMANCE_AUDIT_ENABLED: ${PERFORMANCE_AUDIT_ENABLED:-false}
      HOT_RESPONSE_CACHE_ENABLED: ${HOT_RESPONSE_CACHE_ENABLED:-true}
      STRICT_OFFICIAL_MODE: ${STRICT_OFFICIAL_MODE:-true}
    healthcheck:
      start_period: ${DATA_FETCHER_HEALTH_START_PERIOD:-210s}

  sp500-prewarm:
    environment:
      APP_PROFILE: ${APP_PROFILE:-lite}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      SP500_PREWARM_LIMIT: ${SP500_PREWARM_LIMIT:-0}
      OBSERVABILITY_MAX_RECORDS: ${OBSERVABILITY_MAX_RECORDS:-500}
      PERFORMANCE_AUDIT_ENABLED: ${PERFORMANCE_AUDIT_ENABLED:-false}
      HOT_RESPONSE_CACHE_ENABLED: ${HOT_RESPONSE_CACHE_ENABLED:-true}
      STRICT_OFFICIAL_MODE: ${STRICT_OFFICIAL_MODE:-true}
    profiles:
      - prewarm
