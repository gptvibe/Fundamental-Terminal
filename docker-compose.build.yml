services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fundamentals}
      POSTGRES_USER: ${POSTGRES_USER:-fundamental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fundamental} -d ${POSTGRES_DB:-fundamentals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - standard

  backend:
    image: fundamental-terminal/backend:local
    pull_policy: never
    init: true
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      APP_PROFILE: ${APP_PROFILE:-lite}
      DATABASE_URL: "${DATABASE_URL_OVERRIDE:-${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fundamental}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fundamentals}}}"
      REDIS_URL: ${REDIS_URL_OVERRIDE:-${REDIS_URL:-}}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}
      MARKET_USER_AGENT: ${MARKET_USER_AGENT:-${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}}
      DEMO_MODE: ${DEMO_MODE:-false}
      HOT_RESPONSE_CACHE_TTL_SECONDS: ${HOT_RESPONSE_CACHE_TTL_SECONDS:-120}
      HOT_RESPONSE_CACHE_STALE_TTL_SECONDS: ${HOT_RESPONSE_CACHE_STALE_TTL_SECONDS:-900}
      PERFORMANCE_AUDIT_ENABLED: ${PERFORMANCE_AUDIT_ENABLED:-false}
      PERFORMANCE_AUDIT_MAX_RECORDS: ${PERFORMANCE_AUDIT_MAX_RECORDS:-5000}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-180}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      API_RATE_LIMIT_TRUST_PROXY: ${API_RATE_LIMIT_TRUST_PROXY:-false}
      API_RATE_LIMIT_EXEMPT_PATHS: ${API_RATE_LIMIT_EXEMPT_PATHS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    ports:
      - "8000:8000"

  data-fetcher:
    image: fundamental-terminal/backend:local
    pull_policy: never
    init: true
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      APP_PROFILE: ${APP_PROFILE:-standard}
      DATABASE_URL: "${DATABASE_URL_OVERRIDE:-${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fundamental}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fundamentals}}}"
      REDIS_URL: ${REDIS_URL_OVERRIDE:-redis://redis:6379/0}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}
      MARKET_USER_AGENT: ${MARKET_USER_AGENT:-${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}}
      DEMO_MODE: ${DEMO_MODE:-false}
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/docker/backend/healthcheck-data-fetcher.sh"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - standard

  sp500-prewarm:
    image: fundamental-terminal/backend:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      APP_PROFILE: ${APP_PROFILE:-prewarm}
      DATABASE_URL: "${DATABASE_URL_OVERRIDE:-${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fundamental}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fundamentals}}}"
      REDIS_URL: ${REDIS_URL_OVERRIDE:-redis://redis:6379/0}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}
      MARKET_USER_AGENT: ${MARKET_USER_AGENT:-${SEC_USER_AGENT:-FundamentalTerminal/1.0 (contact@example.com)}}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - prewarm

  frontend:
    image: fundamental-terminal/frontend:local
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-${DEMO_MODE:-false}}
        NEXT_PUBLIC_PERFORMANCE_AUDIT_ENABLED: ${NEXT_PUBLIC_PERFORMANCE_AUDIT_ENABLED:-false}
    environment:
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-${DEMO_MODE:-false}}
      NEXT_PUBLIC_PERFORMANCE_AUDIT_ENABLED: ${NEXT_PUBLIC_PERFORMANCE_AUDIT_ENABLED:-false}
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(5000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    ports:
      - "3000:3000"

volumes:
  postgres_data:
